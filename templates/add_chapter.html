<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <title>Create a Chapter</title>
</head>
<body class='page_look font_family_poppins'>
    <div class="form-container" style="margin-top: 12%;">
        {% if is_editing %}
        <h1>Edit the Chapter</h1>
        <form method="POST" action="{{url_for('update_chapter', chapter_id=chapter.id)}}">
            <div>
                <label for="name">Chapter Name:</label>
                <input type="text" id="s_name" name="name" value="{{ chapter.name }}" required>
            </div>
            
            <div>
                <label for="description">Description:</label>
                <input id="description" name="description" value="{{ chapter.description }}" required>
            </div>
            
            <div>
                <button type="submit" class="submit-button" style="margin-top: 40px;">Update Chapter</button>
            </div>
        </form>
        {% else %}
        <h1>Create a New Chapter</h1>
        <form method="POST" action="{{url_for('add_chapters', subject_id=subject_id)}}">
            <div>
                <label for="name">Chapter Name:</label>
                <input type="text" id="s_name" name="name" placeholder="Enter chapter name" required>
            </div>
            
            <div>
                <label for="description">Description:</label>
                <input id="description" name="description" placeholder="Enter chapter description" required>
            </div>
            
            <div>
                <button type="submit" class="submit-button" style="margin-top: 40px;">Add Chapter</button>
            </div>
        </form>
        {% endif %}
    </div>
</body>

</html>
