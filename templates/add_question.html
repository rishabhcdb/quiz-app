<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        form {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 35px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 20px rgba(66, 135, 245, 0.2);
        }

        .form-title {
            color: #ffffff;
            margin-bottom: 25px;
            font-size: 28px;
            text-align: center;
        }

        div {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e0e0e0;
            font-size: 16px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #3a3a3a;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 2px #4287f5;
            background-color: #404040;
        }

        select {
            cursor: pointer;
        }

        input::placeholder {
            color: #888888;
        }

        button[type="submit"] {
            background-color: #0062ff;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 35px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 50%;
            transition: all 0.3s ease;
            margin: 0 auto;
            display: block;
        }

        button[type="submit"]:hover {
            background-color: #005eff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(66, 135, 245, 0.3);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <form method="POST" action="{{url_for('add_questions', subject_id=subject_id, qz_id=qz_id)}}">
        <h2 class="form-title">Add a question</h2>
        
        <div>
            <label for="question_text">Question:</label>
            <input type="text" id="question_text" name="question_text" placeholder="Add question" required>
        </div>
        
        <div>
            <label for="option_1">Option 1:</label>
            <input type="text" id="option_1" name="option_1" placeholder="Add option 1" required>
        </div>

        <div>
            <label for="option_2">Option 2:</label>
            <input type="text" id="option_2" name="option_2" placeholder="Add option 2" required>
        </div>

        <div>
            <label for="option_3">Option 3:</label>
            <input type="text" id="option_3" name="option_3" placeholder="Add option 3" required>
        </div>

        <div>
            <label for="option_4">Option 4:</label>
            <input type="text" id="option_4" name="option_4" placeholder="Add option 4" required>
        </div>

        <div>
            <label for="correct_option">Correct option:</label>
            <select id="correct_option" name="correct_option" required>
                <option value="option1">Option 1</option>
                <option value="option2">Option 2</option>
                <option value="option3">Option 3</option>
                <option value="option4">Option 4</option>
            </select>
        </div>
        <div>
            <button type="submit">Add Question</button>
        </div>
    </form>
</body>
</html>
