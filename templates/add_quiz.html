<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Quiz</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(66, 135, 245, 0.2);
            width: 100%;
            max-width: 380px;
            text-align: left;
        }

        .form-container h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .form-container label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e0e0e0;
            text-align: left;
        }

        .form-container input,
        .form-container textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            max-width: 320px;
            background-color: #3a3a3a;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        /* Style for readonly inputs */
        .form-container input[readonly] {
            background-color: #2d2d2d;
            color: #888888;
            cursor: not-allowed;
        }

        .form-container input:focus,
        .form-container textarea:focus {
            outline: none;
            box-shadow: 0 0 0 2px #4287f5;
            background-color: #404040;
        }

        .form-container input::placeholder,
        .form-container textarea::placeholder {
            color: #888888;
        }

        .form-container textarea {
            height: 80px;
            resize: none;
        }

        .form-container button {
            background-color: #146eff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 auto;
            display: block;
        }

        .form-container button:hover {
            background-color: #2e7afe;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(66, 135, 245, 0.3);
        }

        .form-container button:active {
            transform: translateY(0);
        }

        .form-container button:focus {
            outline: none;
            box-shadow: 0 0 5px #4287f5;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Create a New Quiz</h1>
        <form method="POST" action="{{url_for('create_quiz', subject_id=subject_id, chapter_id=chapter_id)}}">
            <div>
                <label for="chapter_id">Chapter ID:</label>
                <input type="text" id="chapter_id" name="chapter_id" placeholder="Enter chapter ID" value={{chapter_id}} readonly>
            </div>

            <div>
                <label for="subject_id">Subject ID:</label>
                <input type="text" id="subject_id" name="subject_id" placeholder="Enter subject ID" value={{subject_id}} readonly>
            </div>

            <div>
                <label for="date_of_quiz">Date of Quiz:</label>
                <input id="date_of_quiz" name="date_of_quiz" placeholder="Enter date of quiz" required>
            </div>

            <div>
                <label for="time_duration">Duration:</label>
                <input id="time_duration" name="time_duration" placeholder="Enter quiz duration" required>
            </div>

            <div>
                <label for="remarks">Chapter Name:</label>
                <input id="remarks" name="remarks" placeholder="Enter chapter name" required>
            </div>

            <div>
                <button type="submit">Create Quiz</button>
            </div>
        </form>
    </div>
</body>
</html>
