<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Subject</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(66, 135, 245, 0.2);
            width: 100%;
            max-width: 380px;
            text-align: left;
        }

        .form-container h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .form-container label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e0e0e0;
            text-align: left;
        }

        .form-container input,
        .form-container textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            max-width: 320px;
            background-color: #3a3a3a;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .form-container input:focus,
        .form-container textarea:focus {
            outline: none;
            box-shadow: 0 0 0 2px #4287f5;
            background-color: #404040;
        }

        .form-container input::placeholder,
        .form-container textarea::placeholder {
            color: #888888;
        }

        .form-container textarea {
            height: 80px;
            resize: none;
        }

        .form-container button {
            background-color: #0c69ff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 auto;
            display: block;
        }

        .form-container button:hover {
            background-color: #2b78ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(66, 135, 245, 0.3);
        }

        .form-container button:active {
            transform: translateY(0);
        }

        .form-container button:focus {
            outline: none;
            box-shadow: 0 0 5px #4287f5;
        }
    </style>
</head>
<body class="page_look">
   
    <div class="form-container">
        <h1>Create a New Subject</h1>
        <form method="POST" action="/admin/subjects/new">
            <div>
                <label for="s_name">Subject Name:</label>
                <input type="text" id="s_name" name="s_name" placeholder="Enter subject name" required>
            </div>
            
            <div>
                <label for="description">Description:</label>
                <input id="description" name="description" placeholder="Enter subject description">
            </div>
            
            <div>
                <button type="submit">Create Subject</button>
            </div>
        </form>
    </div>
</body>
</html>
