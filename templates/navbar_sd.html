<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inverted Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    .navbar {
      background-color: #03091e;
      padding: 10px 50px;
      margin-top: 20px;
      position: static;
      top: 30px;
      left: 50%;
      z-index: 1;
      display: flex;
      align-items: center;
      border-radius: 35px;
      box-shadow: 0 0 50px rgba(255, 255, 255, 0.2),
        0 0 5px rgba(255, 255, 255, 0.1),
        0 0 20px rgba(255, 255, 255, 0.05);
      max-width: fit-content;
      margin: 5 auto !important;
      
    }

    .app-name {
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      font-family: 'Arial', sans-serif;
      letter-spacing: 1px;
      margin-right: 40px;
      padding: 5px 0;
      font-family: 'Poppins', sans-serif;
    }

    .nav-links {
      display: flex;
      gap: 10px;
    }

    .nav-item {
      text-decoration: none;
      font-size: 16px;
      color: #b8b8b8;
      padding: 8px 20px;
      border-radius: 25px;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .nav-item:hover {
      color: #ffffff;
      background-color: #2d2d2d;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .nav-item.active {
      background-color: #333;
      color: #ffffff;
    }

    .main-content {
      margin-top: 100px; /* Added more space for fixed navbar */
      padding: 20px;
    }

    .logo {
      margin-left: 25px;
      margin-top: 4%;
      color: #051855;
      font-family: 'Poppins', sans-serif;
      text-decoration: underline;
      font-weight: 550;
      font-size: 30px;
    }
  </style>
</head>

<body>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 50px; margin-top: 20px;margin-right: 90px;">
    <h3 class="logo" style="margin-top:33px; margin-left:0px;">Quiz-Master</h3>
    <nav class="navbar" style="background-color: #03091e; padding: 10px 20px; border-radius: 35px; display: flex; align-items: center;">
      <div class="nav-links" style="display: flex; gap: 10px;">
        <a href="{{ url_for('student_dashboard.student_dashboard') }}" class="nav-item" style="text-decoration: none;">Home</a>
        <a href="{{ url_for('student_performance') }}" class="nav-item" style="text-decoration: none;">Scores</a>
        <a href="/chapters" class="nav-item" style="text-decoration: none;">About</a>
      </div>
    </nav>
    <a href="{{ url_for('logout') }}" style="text-decoration: none;">
      <button type="button"
          style="padding: 10px 20px;margin-top: 35%; font-size: 16px; color: white; background-color: #193282; border: none; border-radius: 35px; cursor: pointer;">
          Logout
      </button>
    </a>
  </div>

  
</body>
