<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        h1 {
            text-align: center;
            color: #dfdfdf;
            margin-top: 5%;
        }
        .chart-container {
            margin: auto;
            margin-top: 30px;
            width: 60%;
            max-width: 900px;
            height: 450px;
            background: rgb(0, 10, 30);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body class='page_look font_family_poppins'>

    {% include 'navbar_sd.html' %}

    <h1 style="margin-top: 70px;font-size: 35px;">Subject-wise Quiz Attempts vs Total Quizzes</h1>

    <div class="chart-container">
        <canvas id="attemptsChart"></canvas>
    </div>

    <script>
        let subjects = JSON.parse('{{ subjects | tojson | safe }}');
        let attempts = JSON.parse('{{ attempts | tojson | safe }}');
        let totalQuizzes = JSON.parse('{{ total | tojson | safe }}');
    
        const ctx = document.getElementById('attemptsChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: subjects,
                datasets: [
                    {
                        label: 'Quizzes Attempted',
                        data: attempts,
                        backgroundColor: 'rgba(54, 162, 235, 0.7)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1,
                        barThickness: 18
                    },
                    {
                        label: 'Total Quizzes',
                        data: totalQuizzes,
                        backgroundColor: 'rgba(255, 99, 132, 0.7)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 1,
                        barThickness: 18
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            color: '#dfdfdf',
                            font: { size: 14 },
                            stepSize: 1, // Ensures only whole numbers are shown
                            callback: function(value) {
                                return Number.isInteger(value) ? value : null;
                            }
                        },
                        grid: { color: 'rgba(256, 256, 256, 0.3)' },
                        title: {
                            display: true,
                            text: 'Number of Quizzes',
                            font: { size: 18 },
                            color: '#dfdfdf'
                        }
                    },
                    x: {
                        categoryPercentage: 0.5,
                        ticks: { color: '#dfdfdf', font: { size: 16 } },
                        grid: { color: 'rgba(256, 256, 256, 0.3)' },
                        title: {
                            display: true,
                            text: 'Subjects',
                            font: { size: 18 },
                            color: '#dfdfdf'
                        }
                    }
                }
            }
        });
    </script>
    {%include 'footer.html'%}
</body>
</html>
