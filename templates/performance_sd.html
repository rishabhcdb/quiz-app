<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .chart-container {
            width: 80%;
            max-width: 900px;
            height: 500px; /* Increased height */
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            height: 100% !important; /* Ensures it takes full height */
        }
    </style>
</head>
<body>

    <h1>Performance Overview</h1>

    <div class="chart-container">
        <canvas id="performanceChart"></canvas>
    </div>

    <script>
        // Data from Flask
        let quizNames = {{ quiz_names | tojson }};
        let scores = {{ quiz_scores | tojson }};

        // Bar chart configuration
        const ctx = document.getElementById('performanceChart').getContext('2d');
        const performanceChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: quizNames,
                datasets: [{
                    label: 'Score (%)',
                    data: scores,
                    backgroundColor: [
                        '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'
                    ],
                    borderRadius: 6,
                    barThickness: 50, 
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        ticks: {
                            stepSize: 10,
                            font: { size: 16 },
                            color: '#333'
                        },
                        title: {
                            display: true,
                            text: 'Score (%)',
                            font: { size: 18 }
                        }
                    },
                    x: {
                        ticks: {
                            font: { size: 16 },
                            color: '#333'
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        titleFont: { size: 16 },
                        bodyFont: { size: 14 },
                        padding: 12
                    }
                },
                animation: {
                    duration: 1500,
                    easing: 'easeOutBounce'
                }
            }
        });
    </script>

</body>
</html>
