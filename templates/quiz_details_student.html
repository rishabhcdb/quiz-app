<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap"
        rel="stylesheet">
</head>

<body class="page_look font_family_poppins">
    {% include 'navbar_sd.html' %}
    <h1 style="text-align: center; font-weight: 600; margin-top: -50px;">Quiz Details</h1>
    <div class="sd-container">
        <div style="text-align: left;">
            <h2 class="sd-subtitle"><span style="font-size: 28px;"> {{quiz.remarks}} Quiz</span>  </h2>
        </div>
        <div style="text-align: left;">
        <h2 class="sd-subtitle">Subject Name: <span class="highlight"> {{subject_name}}</span></h2>
        <h2 class="sd-subtitle">Chapter Name: <span class="highlight">{{chapter_name}} </span></h2>
        <h2 class="sd-subtitle">Number of Qs: <span class="highlight">{{quiz_questions_numbers}} </span></h2>
        <h2 class="sd-subtitle">Date: <span class="highlight">{{quiz.date_of_quiz}} </span></h2>
        <h2 class="sd-subtitle">Duration: <span class="highlight">{{quiz.time_duration}} </span></h2>
        </div>

        <a href="/student">
            <button type="button" style="padding: 7px; width: 85px; background-color: rgb(64, 81, 122); color: rgb(211, 211, 211); border: none; border-radius: 35px; cursor: pointer;margin-top: 10px;" > 
                Close </button>
        </a>


    </div>
</body>

</html>
