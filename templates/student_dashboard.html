<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>

<body class='page_look font_family_poppins'>
    {% include 'navbar_sd.html' %}
    <h1 style="text-align: center;">Hello {{ userName }}, let's prepare!</h1>
    <h4 style="text-align: center;">Available Quizzes</h4>
    <div style="height: 50vh; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 20px;">
        {% for quiz in quizzes %}
        <div  style="width: 25%;min-height: 120px; margin-top: 20px; background-color: #7f9ced94; padding: 25px 35px; border-radius: 25px; border: 0; box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.0); text-align: center; margin-top: 0px; display: flex; flex-direction: column; justify-content: space-between;">
            <h3 style="text-align:left;font-size: 24px; color:#010b25; padding: 10px 0px; line-height: 0px; font-weight: 500;">{{ quiz.remarks }}</h3>
            <p style="text-align:left;color: rgb(71, 71, 71); font-size: 15px;padding: 2px 0px;">Date: {{ quiz.date_of_quiz }}</p>
            <p style="text-align:left;color: rgb(71, 71, 71); font-size: 15px;padding: 0px 0px; margin-top: -18px;">Duration: {{ quiz.time_duration }} minutes</p>
            <div style="display: flex;justify-content: center;gap: 20px;">
            <a href="{{ url_for('get_quiz_details', quiz_id=quiz.id) }}">
                <button style="margin-top: 20px;font-size: 14px; padding: 10px 15px; background-color: rgb(64, 81, 122); color: rgb(211, 211, 211); border: none; border-radius: 35px;">View Details</button>
            </a>

            <a href="{{ url_for('start_quiz_prev') }}">
                <button style="margin-top: 20px;font-size: 14px; padding: 10px 15px; background-color: rgb(64, 81, 122); color: rgb(211, 211, 211); border: none; border-radius: 35px;">Start Quiz</button>
            </a>
        </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
